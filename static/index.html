<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM | Jens Meerkötter</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Zur Übersicht"><img src="logo.svg" alt="Jens Meerkötter"></a>
      <nav class="mainnav" aria-label="Hauptmenü">
        <a href="#/" data-nav="overview">Übersicht</a>
        <a href="#/firmen" data-nav="companies">Firmen</a>
        <a href="#/privatkunden" data-nav="private">Privatkunden</a>
        <a href="#/personen" data-nav="contacts">Personen</a>
        <a href="#/pipeline" data-nav="pipeline">Pipeline</a>
        <a href="#/empfehler" data-nav="referrers">Empfehler</a>
      </nav>
      <div class="areafilter" id="area-filter" role="group" aria-label="Bereich">
        <button type="button" data-area="">Alle</button>
        <button type="button" data-area="firma">Firma</button>
        <button type="button" data-area="privat">Privat</button>
      </div>
      <div class="global-search" id="global-search"></div>
      <div class="top-actions">
        <button class="btn btn-ghost" id="new-contact" type="button">Neue Person</button>
        <button class="btn" id="new-company" type="button">Neue Firma</button>
      </div>
    </div>
  </header>
  <main id="view" class="wrap" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
